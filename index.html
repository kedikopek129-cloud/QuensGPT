
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6fc">
<title>Qwen Arena</title>
<style>
:root{
--bg:#f7f6fc;--glass:rgba(255,255,255,.76);
--text:#242239;--muted:#9693a9;--purple:#8059ed;
--border:#ffffff;--shadow:0 12px 40px #51427d12;
}
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;color:var(--text);
font-family:Inter,system-ui,sans-serif;
background:radial-gradient(circle at 10% 10%,#e9ddff,transparent 34%),
radial-gradient(circle at 90% 90%,#e2eaff,transparent 35%),var(--bg);
}
button,textarea,select{font:inherit}
button{cursor:pointer}
.glass{
background:var(--glass);backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
border:1px solid var(--border);box-shadow:var(--shadow);
}
.app{max-width:1250px;margin:auto;padding:18px}
header{
height:66px;border-radius:20px;padding:0 20px;
display:flex;align-items:center;justify-content:space-between;
}
.brand{font-size:22px;font-weight:850;letter-spacing:-1px}
.brand span{color:var(--purple)}
.online{font-size:11px;color:#299d70;background:#e4f8ed;padding:8px 12px;border-radius:20px}
.layout{display:grid;grid-template-columns:245px 1fr;gap:17px;margin-top:18px}
.sidebar{border-radius:22px;padding:16px;min-height:calc(100vh - 120px)}
.new{
width:100%;padding:13px;border:0;border-radius:13px;
background:var(--purple);color:white;font-weight:700;
}
.label{font-size:10px;color:var(--muted);font-weight:750;letter-spacing:1px;margin:25px 5px 10px}
.history{display:grid;gap:6px}
.history-item{
padding:11px;border-radius:11px;color:#77748d;
font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
cursor:pointer;
}
.history-item.active{background:#eee9ff;color:var(--purple)}
.side-info{
margin-top:30px;background:#f0ecff;color:#77708e;
padding:13px;border-radius:14px;font-size:11px;line-height:1.6;
}
.chat{border-radius:22px;min-height:calc(100vh - 120px);display:flex;flex-direction:column;overflow:hidden}
.chat-head{
padding:17px 20px;border-bottom:1px solid #eeeaf5;
display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.model-info{display:flex;align-items:center;gap:11px}
.model-icon{
width:40px;height:40px;border-radius:14px;
display:grid;place-items:center;color:white;font-size:21px;
background:linear-gradient(135deg,#aa8bff,#7147e8);
}
.model-name{font-size:14px;font-weight:750}
.model-sub{font-size:10px;color:var(--muted);margin-top:3px}
.controls{display:flex;gap:8px}
select{
max-width:145px;padding:10px;border-radius:11px;
border:1px solid #ece8f5;background:white;color:#554e70;
font-size:11px;outline:none;
}
.messages{
flex:1;min-height:350px;overflow-y:auto;
padding:24px;display:flex;flex-direction:column;gap:18px;
}
.welcome{text-align:center;margin:auto;max-width:470px;padding:25px 10px}
.welcome-icon{
width:65px;height:65px;border-radius:22px;margin:0 auto 18px;
display:grid;place-items:center;font-size:28px;
background:linear-gradient(135deg,#eee6ff,#fff);
}
.welcome h1{font-size:30px;letter-spacing:-1px;margin:0 0 10px}
.welcome p{font-size:13px;color:var(--muted);line-height:1.7}
.suggestions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:22px}
.suggestions button{
padding:10px 13px;border-radius:12px;border:1px solid #e9e4f3;
background:white;color:#716b88;font-size:11px;
}
.message{display:flex;gap:10px;max-width:88%;align-items:flex-start}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{
width:32px;height:32px;flex-shrink:0;border-radius:11px;
display:grid;place-items:center;background:#eee9ff;color:var(--purple);
font-size:12px;font-weight:800;
}
.user .avatar{background:#302a48;color:white}
.bubble{
padding:13px 16px;border-radius:5px 17px 17px 17px;
background:#f6f4fc;border:1px solid #eeeaf5;
font-size:13px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;
}
.user .bubble{background:#8059ed;color:white;border:0;border-radius:17px 5px 17px 17px}
.bubble small{display:block;color:#9991b1;font-size:10px;margin-bottom:5px}
.composer-wrap{padding:15px 20px 19px;border-top:1px solid #eeeaf5}
.composer{padding:12px;border-radius:18px;background:white;border:1px solid #eeeaf5}
textarea{
width:100%;min-height:55px;resize:none;border:0;outline:0;
padding:7px;background:transparent;color:var(--text);font-size:14px;
}
.composer-bottom{display:flex;justify-content:space-between;align-items:center}
.hint{font-size:10px;color:#aaa5b9}
.send{
width:40px;height:40px;border:0;border-radius:13px;
background:var(--purple);color:white;font-size:19px;
}
.send:disabled{opacity:.45}
.disclaimer{text-align:center;color:#aaa5b9;font-size:10px;margin-top:10px}
.error{color:#d45e79;font-size:12px;text-align:center}
@media(max-width:720px){
.app{padding:10px}
.layout{grid-template-columns:1fr}
.sidebar{min-height:0;padding:12px}
.label,.history,.side-info{display:none}
.chat{min-height:calc(100vh - 125px)}
.chat-head{padding:12px}
.controls{flex-direction:column}
select{max-width:130px}
.messages{padding:15px;min-height:350px}
.message{max-width:96%}
.welcome h1{font-size:25px}
}
</style>
</head>
<body>
<div class="app">
<header class="glass">
<div class="brand">Qwen<span>Arena</span></div>
<span class="online">● AI Workspace</span>
</header>

<div class="layout">
<aside class="sidebar glass">
<button class="new" id="newChat">＋ New Chat</button>
<div class="label">RECENT CONVERSATIONS</div>
<div class="history" id="history"></div>
<div class="side-info">
<strong>Qwen Arena</strong><br>
Choose your AI model and start chatting. Your history stays in this browser.
</div>
</aside>

<section class="chat glass">
<div class="chat-head">
<div class="model-info">
<div class="model-icon">✦</div>
<div>
<div class="model-name" id="modelName">Qwen Plus</div>
<div class="model-sub">AI Assistant</div>
</div>
</div>
<div class="controls">
<select id="model">
<option value="qwen-plus">Qwen Plus</option>
<option value="qwen-turbo">Qwen Turbo</option>
<option value="qwen-max">Qwen Max</option>
<option value="qwen-flash">Qwen Flash</option>
</select>
<select id="effort">
<option value="fast">Fast</option>
<option value="balanced" selected>Balanced</option>
<option value="deep">Deep</option>
</select>
</div>
</div>

<div class="messages" id="messages"></div>

<div class="composer-wrap">
<div class="composer">
<textarea id="prompt" placeholder="Message Qwen Arena..." rows="2"></textarea>
<div class="composer-bottom">
<span class="hint">Enter to send · Shift + Enter for new line</span>
<button class="send" id="send">↑</button>
</div>
</div>
<div class="disclaimer">AI can make mistakes. Verify important information.</div>
<div class="error" id="error"></div>
</div>
</section>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const MODELS={
"qwen-plus":{name:"Qwen Plus",api:"qwen-plus"},
"qwen-turbo":{name:"Qwen Turbo",api:"qwen-turbo"},
"qwen-max":{name:"Qwen Max",api:"qwen-max"},
"qwen-flash":{name:"Qwen Flash",api:"qwen-flash"}
};
const STORAGE="qwen_arena_chats_v2";
let chats=[];
let activeId=null;
let busy=false;

try{chats=JSON.parse(localStorage.getItem(STORAGE)||"[]")}catch{chats=[]}
function save(){
try{localStorage.setItem(STORAGE,JSON.stringify(chats))}catch{}
}
function active(){
return chats.find(c=>c.id===activeId);
}
function newChat(){
const chat={id:Date.now()+Math.random(),title:"New conversation",messages:[]};
chats.unshift(chat);activeId=chat.id;save();render();
}
function renderHistory(){
const el=$("history");el.replaceChildren();
chats.slice(0,20).forEach(c=>{
const b=document.createElement("div");
b.className="history-item"+(c.id===activeId?" active":"");
b.textContent=c.title;
b.onclick=()=>{activeId=c.id;render()};
el.append(b);
});
}
function addBubble(role,text,model=""){
const row=document.createElement("div");
row.className="message "+role;
const avatar=document.createElement("div");
avatar.className="avatar";
avatar.textContent=role==="user"?"Y":"Q";
const bubble=document.createElement("div");
bubble.className="bubble";
if(model){
const small=document.createElement("small");
small.textContent=model;
bubble.append(small);
}
bubble.append(document.createTextNode(text));
row.append(avatar,bubble);
$("messages").append(row);
}
function render(){
const el=$("messages");el.replaceChildren();
const c=active();
if(!c||!c.messages.length){
const welcome=document.createElement("div");
welcome.className="welcome";
welcome.innerHTML=`
<div class="welcome-icon">✦</div>
<h1>What are we exploring?</h1>
<p>Choose a Qwen model and start a conversation. One assistant, one focused response at a time.</p>
<div class="suggestions">
<button data-prompt="Explain quantum computing simply.">Explain quantum computing</button>
<button data-prompt="Give me three creative website ideas.">Website ideas</button>
<button data-prompt="Teach me JavaScript basics.">Learn JavaScript</button>
</div>`;
el.append(welcome);
}else{
c.messages.forEach(m=>addBubble(m.role,m.content,m.model||""));
}
el.scrollTop=el.scrollHeight;
renderHistory();
}
$("model").onchange=()=>{
$("modelName").textContent=MODELS[$("model").value].name;
};
$("newChat").onclick=newChat;
document.addEventListener("click",e=>{
const b=e.target.closest("[data-prompt]");
if(b){$("prompt").value=b.dataset.prompt;$("prompt").focus()}
});
async function sendMessage(){
if(busy)return;
const text=$("prompt").value.trim();
if(!text)return;
if(!active())newChat();
const c=active();
const selected=MODELS[$("model").value];
const effort=$("effort").value;
c.messages.push({role:"user",content:text});
if(c.messages.length===1)c.title=text.slice(0,32);
$("prompt").value="";
$("error").textContent="";
busy=true;$("send").disabled=true;
render();
const waiting=document.createElement("div");
waiting.className="message";
waiting.id="waiting";
const bubble=document.createElement("div");
bubble.className="bubble";
bubble.textContent="Thinking...";
waiting.append(bubble);
$("messages").append(waiting);
try{
const response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
model:selected.api,
effort,
messages:c.messages.map(m=>({role:m.role,content:m.content}))
})
});
const data=await response.json();
if(!response.ok)throw new Error(data.error||"Request failed.");
if(typeof data.reply!=="string")throw new Error("Invalid server response.");
c.messages.push({role:"assistant",content:data.reply,model:selected.name});
save();
}catch(err){
c.messages.push({
role:"assistant",
content:"Unable to connect to the AI service. "+err.message,
model:"Connection error"
});
save();
}finally{
busy=false;$("send").disabled=false;render();
}
}
$("send").onclick=sendMessage;
$("prompt").onkeydown=e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();sendMessage();
}
};
render();
if(!chats.length)newChat();
</script>
</body>
</html>
